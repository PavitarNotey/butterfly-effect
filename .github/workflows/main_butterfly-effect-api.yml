# Deploy only the staged FastAPI runtime; never upload the repository checkout.
name: Build and deploy Python app to Azure Web App - butterfly-effect-api

on:
  push:
    branches:
      - 'main'
    paths:
      - 'backend/**'
      - 'frontend/src/replay/invisible-run.json'
      - 'frontend/src/replay/missed-chance.json'
      - 'frontend/src/replay/untouched-pass.json'
      - '.github/workflows/main_butterfly-effect-api.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    env:
      AI_PROVIDER: mock
      AI_PAID_GENERATION_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.5'
      - name: Install locked backend dependencies
        run: uv sync --locked --python 3.12
      - name: Check and test backend without live AI
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync python -m pytest
      - name: Stage backend runtime and canonical data
        run: uv run --no-sync python deployment.py package --output ../output/app-service
      - name: Export locked production dependencies for App Service
        run: uv export --locked --no-dev --no-emit-project --format requirements.txt --output-file ../output/app-service/requirements.txt
      - name: Verify production dependencies and packaged startup
        run: |
          uv venv ../output/app-service-venv --python 3.12
          uv pip install --python ../output/app-service-venv/bin/python --require-hashes -r ../output/app-service/requirements.txt
          uv run --no-sync python deployment.py smoke --app-dir ../output/app-service --python ../output/app-service-venv/bin/python
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: output/app-service/
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # Required for the existing federated identity login.
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: app-service
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_22952417F6F14D3180E0195BDE2CCC46 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1FCA76D4B35940B7860BA3F69C40E84C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_926E9969C7A64256AB7111DB1FD9E63E }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'butterfly-effect-api'
          slot-name: 'Production'
          package: app-service
          startup-command: 'python -m uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}'
